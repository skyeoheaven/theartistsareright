<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Artists Are Right</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        img {
            width: 320px; /* medium sized */
            max-width: 80vw;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        .coming-soon {
            font-size: 1.8rem;
            color: #222;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image1.png" alt="The Artists Are Right" />
        <div class="coming-soon">COMING SOON</div>
    </div>
</body>
</html>
